<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLUX – Leaks & actus jeux</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#1e1e1e;--mut:#888;--acc:#ccff00}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#fff;font:500 15px/1.4 Inter,sans-serif}
.mono{font-family:'JetBrains Mono',monospace}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1400px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font:800 14px 'JetBrains Mono';letter-spacing:.14em}
.logo b{width:28px;height:28px;border-radius:4px;background:var(--acc);color:#000;display:grid;place-items:center;font-size:14px}
#meta{font:500 11px 'JetBrains Mono';color:var(--mut)}
.bar{max-width:1400px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:99px;border:1px solid #222;background:var(--card);color:var(--mut);font:700 12px 'JetBrains Mono';cursor:pointer}
.chip:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.chip[aria-pressed=true]{background:var(--acc);color:#000;border-color:transparent}
.chip small{margin-left:6px;opacity:.6}
.search{max-width:1400px;margin:10px auto 0}
input{width:100%;height:38px;border-radius:10px;border:1px solid #222;background:var(--card);color:#fff;padding:0 12px;font:inherit}
main{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
a.card{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;border-top:3px solid var(--c)}
a.card:hover{border-color:#333;border-top-color:var(--c)}
.row{display:flex;justify-content:space-between;gap:8px;font:700 11px 'JetBrains Mono';color:var(--mut)}
.tag{color:var(--c)}
h2{font:900 16px/1.3 Inter;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.src{margin-top:auto;font-size:12px;color:var(--mut)}
.empty{grid-column:1/-1;padding:40px 8px;color:var(--mut);text-align:center}
footer{max-width:1400px;margin:auto;padding:8px 16px 32px;font-size:12px;color:#666}
@media (prefers-reduced-motion:no-preference){.dot{animation:p 2s infinite}}
@keyframes p{50%{opacity:.3}}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo"><b>F</b>FLUX</div>
    <div id="meta"><span class="dot"></span>Chargement…</div>
  </div>
  <div class="bar" id="bar" role="group" aria-label="Filtrer par jeu"></div>
  <div class="search"><input id="q" type="search" placeholder="Rechercher un leak, un jeu, une source" aria-label="Rechercher"></div>
</header>
<main id="list" aria-live="polite"></main>
<footer>Articles réels issus de Google Actualités, liés à leur source d’origine. Les leaks restent des rumeurs non officielles : vérifie toujours la source.</footer>
<script>
const COL={"GTA 6":"#ff4fa0","GTA RP":"#ff9f1c","FiveM":"#ff7a00","MW4":"#7bd957","Fortnite":"#a56bff","Valorant":"#ff4655","CS2":"#f5b942","Minecraft":"#4cd964","Roblox":"#3aa0ff"};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let items=[],cat="Tous",query="";
const ago=d=>{const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));
  return m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`};
function render(){
  const cats=["Tous",...Object.keys(COL)];
  $("bar").innerHTML=cats.map(c=>{
    const n=c==="Tous"?items.length:items.filter(i=>i.cat===c).length;
    return `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`}).join("");
  const q=query.toLowerCase();
  const rows=items.filter(i=>(cat==="Tous"||i.cat===cat)&&(!q||(i.title+i.source+i.cat).toLowerCase().includes(q)));
  $("list").innerHTML=rows.length?rows.map(i=>`
    <a class="card" style="--c:${COL[i.cat]||"#ccff00"}" href="${esc(i.link)}" target="_blank" rel="noopener noreferrer">
      <div class="row"><span class="tag">${esc(i.cat)}</span><span>${ago(i.date)}</span></div>
      <h2>${esc(i.title)}</h2>
      <div class="src">${esc(i.source||"Source inconnue")}</div>
    </a>`).join(""):`<p class="empty">${items.length?"Aucun résultat pour ce filtre.":"Pas encore d’articles. Lance une mise à jour (node update.mjs) ou redéploie le site."}</p>`;
}
async function load(){
  try{
    const r=await fetch("leaks.json?"+Date.now());const d=await r.json();
    items=d.items||[];
    $("meta").innerHTML=d.updated?`<span class="dot"></span>${items.length} articles · mis à jour ${ago(d.updated)}`:"En attente de la première mise à jour";
  }catch(e){$("meta").textContent="Impossible de charger leaks.json"}
  render();
}
$("bar").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
$("q").oninput=e=>{query=e.target.value;render()};
load();setInterval(load,3e5);
</script>
</body>
</html>
