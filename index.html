<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FLUX – Leaks & actus jeux</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&family=JetBrains+Mono:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--card:#141414;--line:#1e1e1e;--mut:#888;--acc:#ccff00}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:#fff;font:500 15px/1.5 Inter,sans-serif}
header{position:sticky;top:0;z-index:5;background:rgba(10,10,10,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:12px 16px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1400px;margin:auto}
.logo{display:flex;align-items:center;gap:10px;font:800 14px 'JetBrains Mono';letter-spacing:.14em}
.logo b{width:28px;height:28px;border-radius:4px;background:var(--acc);color:#000;display:grid;place-items:center}
#meta{font:500 11px 'JetBrains Mono';color:var(--mut)}
.bar{max-width:1400px;margin:10px auto 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.chip{flex:none;height:32px;padding:0 14px;border-radius:99px;border:1px solid #222;background:var(--card);color:var(--mut);font:700 12px 'JetBrains Mono';cursor:pointer}
.chip[aria-pressed=true]{background:var(--acc);color:#000;border-color:transparent}
.chip small{margin-left:6px;opacity:.6}
.search{max-width:1400px;margin:10px auto 0}
input{width:100%;height:38px;border-radius:10px;border:1px solid #222;background:var(--card);color:#fff;padding:0 12px;font:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
main{max-width:1400px;margin:auto;padding:16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
.card{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;background:var(--card);border:1px solid var(--line);color:inherit;text-align:left;font:inherit;cursor:pointer;padding:0}
.card:hover{border-color:#333}
.media{position:relative;aspect-ratio:16/9;background:linear-gradient(135deg,var(--c),#0a0a0a 85%);display:grid;place-items:center;overflow:hidden}
.media span{font:900 26px 'Inter';letter-spacing:-.02em;color:rgba(0,0,0,.55);padding:8px;text-align:center}
.media img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pill{position:absolute;top:10px;left:10px;z-index:1;background:var(--c);color:#000;font:800 11px 'JetBrains Mono';padding:3px 10px;border-radius:99px}
.body{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;flex:1}
h2{font:900 16px/1.3 Inter;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ex{font-size:13px;color:#aaa;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.src{margin-top:auto;font:700 11px 'JetBrains Mono';color:var(--mut)}
.empty{grid-column:1/-1;padding:40px 8px;color:var(--mut);text-align:center}
dialog{margin:auto;width:min(720px,100%);max-height:100dvh;overflow:auto;background:var(--card);color:#fff;border:1px solid #2a2a2a;border-radius:16px;padding:0}
dialog::backdrop{background:rgba(0,0,0,.8)}
dialog .media{aspect-ratio:16/8;border-radius:0}
dialog .in{padding:20px}
dialog h1{font:900 24px/1.25 Inter;margin:6px 0 10px}
dialog p{color:#ccc;margin:12px 0}
.meta{font:700 12px 'JetBrains Mono';color:var(--mut)}
.btn{display:inline-block;background:var(--acc);color:#000;font-weight:800;padding:12px 18px;border-radius:10px;text-decoration:none;margin-top:8px}
.x{position:absolute;top:10px;right:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:rgba(0,0,0,.7);color:#fff;font-size:18px;cursor:pointer}
footer{max-width:1400px;margin:auto;padding:8px 16px 32px;font-size:12px;color:#666}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:6px}
@media (prefers-reduced-motion:no-preference){.dot{animation:p 2s infinite}}
@keyframes p{50%{opacity:.3}}
</style>
</head>
<body>
<header>
  <div class="top"><div class="logo"><b>F</b>FLUX</div><div id="meta"><span class="dot"></span>Chargement…</div></div>
  <div class="bar" id="bar" role="group" aria-label="Filtrer par jeu"></div>
  <div class="search"><input id="q" type="search" placeholder="Rechercher un leak, un jeu, une source" aria-label="Rechercher"></div>
</header>
<main id="list" aria-live="polite"></main>
<footer>Articles réels issus de Google Actualités et de sites gaming, avec lien vers la source d’origine. Les leaks restent des rumeurs non officielles : vérifie toujours la source.</footer>
<dialog id="art" aria-label="Article"></dialog>
<script>
const COL={"GTA 6":"#ff4fa0","GTA RP":"#ff9f1c","FiveM":"#ff7a00","MW4":"#7bd957","Fortnite":"#a56bff","Valorant":"#ff4655","CS2":"#f5b942","Minecraft":"#4cd964","Roblox":"#3aa0ff"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safe=u=>/^https?:\/\//.test(u)?esc(u):"";
let items=[],rows=[],cat="Tous",query="";
const ago=d=>{const m=Math.max(1,Math.round((Date.now()-new Date(d))/6e4));return m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`};
const media=i=>`<div class="media" style="--c:${COL[i.cat]||"#ccff00"}"><span>${esc(i.cat)}</span>${i.image?`<img src="${safe(i.image)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">`:""}</div>`;
function render(){
  $("bar").innerHTML=["Tous",...Object.keys(COL)].map(c=>{
    const n=c==="Tous"?items.length:items.filter(i=>i.cat===c).length;
    return `<button class="chip" aria-pressed="${c===cat}" data-c="${esc(c)}">${esc(c)}<small>${n}</small></button>`}).join("");
  const q=query.toLowerCase();
  rows=items.filter(i=>(cat==="Tous"||i.cat===cat)&&(!q||(i.title+i.source+i.cat).toLowerCase().includes(q)));
  $("list").innerHTML=rows.length?rows.map((i,k)=>`
    <button class="card" data-k="${k}" style="--c:${COL[i.cat]||"#ccff00"}">
      ${media(i)}
      <div class="body"><h2>${esc(i.title)}</h2>${i.summary?`<p class="ex">${esc(i.summary)}</p>`:""}
      <div class="src">${esc(i.source||"Source inconnue")} · ${ago(i.date)}</div></div>
    </button>`).join(""):`<p class="empty">${items.length?"Aucun résultat pour ce filtre.":"Pas encore d’articles. Lance une mise à jour ou redéploie le site."}</p>`;
  document.querySelectorAll(".card").forEach(c=>{const i=rows[c.dataset.k];c.insertAdjacentHTML("afterbegin",`<span class="pill" style="--c:${COL[i.cat]||"#ccff00"}"></span>`);});
}
function open(k){
  const i=rows[k];if(!i)return;
  $("art").innerHTML=`<div style="position:relative">${media(i)}<button class="x" aria-label="Fermer" onclick="$('art').close()">✕</button></div>
  <div class="in"><div class="meta">${esc(i.cat)} · ${esc(i.source||"")} · ${ago(i.date)}</div>
  <h1>${esc(i.title)}</h1>
  ${i.summary?`<p>${esc(i.summary)}</p>`:`<p>Cet article est publié par ${esc(i.source||"la source")}. Ouvre-le pour lire le détail complet.</p>`}
  <a class="btn" href="${safe(i.link)}" target="_blank" rel="noopener noreferrer">Lire l’article sur ${esc(i.source||"la source")}</a></div>`;
  $("art").showModal();
}
async function load(){
  try{const d=await (await fetch("leaks.json?"+Date.now())).json();items=d.items||[];
    $("meta").innerHTML=d.updated?`<span class="dot"></span>${items.length} articles · mis à jour ${ago(d.updated)}`:"En attente de la première mise à jour";
  }catch(e){$("meta").textContent="Impossible de charger leaks.json"}
  render();
}
$("bar").onclick=e=>{const b=e.target.closest("button");if(b){cat=b.dataset.c;render()}};
$("list").onclick=e=>{const c=e.target.closest(".card");if(c)open(c.dataset.k)};
$("art").onclick=e=>{if(e.target===$("art"))$("art").close()};
$("q").oninput=e=>{query=e.target.value;render()};
load();setInterval(load,3e5);
</script>
</body>
</html>
